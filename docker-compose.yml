services:
  shh5-audiobookshelf:
    image: advplyr/audiobookshelf:2.33.0
    container_name: shh5-audiobookshelf
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:80/healthcheck >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped
    ports:
      - "18805:80"
    user: "1000:1000"
    volumes:
      - /Volume*/DockerAppData/shh5-audiobookshelf/data:/config
      - /Volume*/DockerAppData/shh5-audiobookshelf/metadata:/metadata
    environment:
      - TZ=Asia/Shanghai
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G

x-app-meta:
  web:
    port: 18805
    protocol: http
